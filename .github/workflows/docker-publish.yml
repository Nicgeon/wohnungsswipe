name: Docker Hub

# Baut das Image und veröffentlicht es als nicgeon/wohnungsswipe auf Docker Hub –
# NUR bei einem Release (oder von Hand). Pushes und Merges lösen nichts aus,
# damit keine Actions-Minuten verbraucht werden.
#
# Release-Ablauf:
#   1. "version" in package.json erhöhen und nach master mergen
#   2. Auf GitHub unter "Releases" → "Draft a new release" einen neuen Tag
#      vX.Y.Z auf master anlegen, "Generate release notes" klicken, veröffentlichen
#   → das Image wird als :vX.Y.Z gebaut, und als :latest, wenn das Release keine
#     Vorabversion ("pre-release") ist.
#
# Von Hand: Actions-Tab → "Docker Hub" → "Run workflow" baut den gewählten Branch
# mit der Version aus package.json als :vX.Y.Z und :latest.
# Voraussetzung: Secrets DOCKERHUB_USERNAME und DOCKERHUB_TOKEN.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  IMAGE: nicgeon/wohnungsswipe

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version bestimmen
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          LATEST=true
          if [ "$EVENT" = "release" ]; then
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release-Tag '$RELEASE_TAG' hat nicht das Format vX.Y.Z – es wird kein Image gebaut."
              exit 1
            fi
            V="${RELEASE_TAG#v}"
            if [ "$V" != "$PKG" ]; then
              echo "::warning::Release $RELEASE_TAG, aber package.json enthält Version $PKG."
            fi
            if [ "$PRERELEASE" = "true" ]; then LATEST=false; fi
          else
            V="$PKG"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "::notice::Baue :v$V$([ "$LATEST" = true ] && echo ' und :latest')."

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: QEMU (arm64 für Raspberry Pi / ARM-Server)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=v${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.latest == 'true' }}

      - name: Build und Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
