name: Docker Hub

# Baut das Image und veröffentlicht es als nicgeon/wohnungsswipe auf Docker Hub.
#
# Weg 1 – Version erhöhen und mergen (empfohlen):
#   "version" in package.json erhöhen, nach master mergen – fertig.
#   - jeder Push auf master  → :latest und :sha-<kurz>
#   - ist die Version aus package.json neu (Git-Tag vX.Y.Z existiert noch nicht):
#       zusätzlich :vX.Y.Z, und es wird ein GitHub-Release vX.Y.Z angelegt
#       (mit Tag und automatisch erzeugten Release-Notes aus den Commits)
#   - ist die Version unverändert: nur :latest/:sha (ein bestehender Versionstag
#     wird nie überschrieben)
#
# Weg 2 – Release auf GitHub veröffentlichen:
#   Unter "Releases" → "Draft a new release" einen Tag vX.Y.Z wählen/anlegen und
#   veröffentlichen → genau dieser Stand wird als :vX.Y.Z gebaut, und – wenn es
#   keine Vorabversion ("pre-release") ist – auch als :latest.
#   (Releases, die Weg 1 selbst anlegt, lösen keinen zweiten Build aus: Aktionen
#   mit dem GITHUB_TOKEN starten keine weiteren Workflows.)
#
# Außerdem manuell über "Run workflow" im Actions-Tab (Logik wie Weg 1).
# Voraussetzung: Secrets DOCKERHUB_USERNAME und DOCKERHUB_TOKEN.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: nicgeon/wohnungsswipe

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nötig, um Tag und GitHub-Release vX.Y.Z anzulegen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # auch bestehende Tags laden

      # Ergebnis:
      #   version         – X.Y.Z
      #   push_version    – :vX.Y.Z veröffentlichen?
      #   latest          – :latest veröffentlichen?
      #   create_release  – Tag + GitHub-Release anlegen? (nur Weg 1 mit neuer Version)
      - name: Version bestimmen
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$EVENT" = "release" ]; then
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release-Tag '$RELEASE_TAG' hat nicht das Format vX.Y.Z – es wird kein Image gebaut."
              exit 1
            fi
            V="${RELEASE_TAG#v}"
            if [ "$V" != "$PKG" ]; then
              echo "::warning::Release $RELEASE_TAG, aber package.json enthält Version $PKG."
            fi
            LATEST=true
            if [ "$PRERELEASE" = "true" ]; then LATEST=false; fi
            {
              echo "version=$V"
              echo "push_version=true"
              echo "latest=$LATEST"
              echo "create_release=false"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Release $RELEASE_TAG – wird als :v$V veröffentlicht$([ "$LATEST" = true ] && echo ' und als :latest')."
          else
            V="$PKG"
            if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
              NEW=false
              echo "::notice::Version v$V existiert bereits als Tag – es wird nur :latest veröffentlicht. Zum Release die Version in package.json erhöhen."
            else
              NEW=true
              echo "::notice::Neue Version v$V – wird als :latest und :v$V veröffentlicht, Release v$V wird angelegt."
            fi
            {
              echo "version=$V"
              echo "push_version=$NEW"
              echo "latest=true"
              echo "create_release=$NEW"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: QEMU (arm64 für Raspberry Pi / ARM-Server)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.ver.outputs.latest == 'true' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=v${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.push_version == 'true' }}

      - name: Build und Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Erst nach erfolgreichem Push: legt Tag vX.Y.Z (auf diesem Commit) und das
      # GitHub-Release mit Notizen aus den Commits seit der vorigen Version an.
      - name: GitHub-Release anlegen
        if: steps.ver.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v$V" \
            --target "$GITHUB_SHA" \
            --title "v$V" \
            --generate-notes \
            --notes "Docker-Image: \`${IMAGE}:v$V\` (auch \`:latest\`)"
