name: Docker Hub

# Baut das Image und veröffentlicht es als nicgeon/wohnungsswipe auf Docker Hub.
#
# Release-Ablauf: "version" in package.json erhöhen, nach master mergen – fertig.
#   - jeder Push auf master  → :latest und :sha-<kurz>
#   - ist die Version aus package.json neu (Git-Tag vX.Y.Z existiert noch nicht):
#       zusätzlich :vX.Y.Z, und der Git-Tag vX.Y.Z wird automatisch angelegt
#   - ist die Version unverändert: nur :latest/:sha (ein bestehender Versionstag
#     wird nie überschrieben)
#   - manuell über "Run workflow" im Actions-Tab (gleiche Logik)
# Voraussetzung: Secrets DOCKERHUB_USERNAME und DOCKERHUB_TOKEN.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: nicgeon/wohnungsswipe

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nötig, um den Git-Tag vX.Y.Z anzulegen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # auch bestehende Tags laden

      - name: Version aus package.json
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version v$V existiert bereits als Tag – es wird nur :latest veröffentlicht. Zum Release die Version in package.json erhöhen."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Neue Version v$V – wird als :latest und :v$V veröffentlicht."
          fi

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: QEMU (arm64 für Raspberry Pi / ARM-Server)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=v${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.release == 'true' }}

      - name: Build und Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Git-Tag anlegen
        if: steps.ver.outputs.release == 'true'
        run: |
          git tag "v${{ steps.ver.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.ver.outputs.version }}"
